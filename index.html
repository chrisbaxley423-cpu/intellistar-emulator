<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IntelliSTAR Emulator (Offline)</title>
  <style>
    :root{--accent:#b32b2b;--muted:rgba(255,255,255,0.85);--panel:rgba(0,0,0,0.45)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
    body{background:linear-gradient(180deg,#2c3e50 0%, #4b6476 50%, #8aa1b3 100%);display:flex;align-items:flex-start;justify-content:center}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 10%), linear-gradient(180deg, rgba(0,0,0,0.08), transparent 40%);pointer-events:none}
    .container{width:100%;max-width:1100px;padding:28px}
    .topbar{display:flex;align-items:center;gap:16px}
    .logo{display:flex;align-items:center;gap:12px}
    .twc{font-size:12px;line-height:12px;opacity:0.95}
    .local8{background:#fff;color:#222;padding:6px 10px;font-weight:700;letter-spacing:1px}
    .local8 span{display:block;font-size:11px;margin-top:-6px}
    .city-time{margin-left:12px;display:flex;flex-direction:column}
    #cityName{font-size:26px;font-weight:700}
    #time{font-size:20px;background:rgba(0,0,0,0.25);padding:6px 10px;border-radius:2px;margin-top:6px}
    .city-select{margin-left:auto}
    select{background:rgba(0,0,0,0.35);color:#fff;border:1px solid rgba(255,255,255,0.06);padding:8px;border-radius:4px}

    .alert{margin-top:28px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(4px)}
    .alert-label{background:var(--accent);padding:10px 12px;font-weight:700;letter-spacing:1px}
    .alert-text{background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.22));padding:18px 20px;font-size:18px;min-height:44px}
    .hidden{display:none}

    .now-card{width:800px;max-width:100%;margin:36px 0 0 0;background:linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25));padding:24px;display:flex;gap:20px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
    .gauge{width:220px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .icon{font-size:44px;margin-bottom:6px}
    .temp{font-size:56px;font-weight:700}
    .details{flex:1;color:var(--muted)}
    .cond{font-size:28px;margin-bottom:12px}
    .meta{display:flex;flex-direction:column;gap:8px}
    .meta div{display:flex;justify-content:space-between;align-items:center}
    .meta strong{opacity:0.95;margin-right:10px;font-weight:600}

    .bottom-nav{display:flex;gap:36px;margin-top:18px}
    .nav-item{opacity:0.8}
    .nav-item.active{border-bottom:4px solid rgba(255,255,255,0.85);padding-bottom:6px}

    /* small screens */
    @media (max-width:800px){
      .now-card{flex-direction:column;align-items:center}
      .gauge{width:100%}
    }

    /* small helper for offline badge */
    .offline-badge{position:fixed;left:10px;bottom:10px;background:rgba(0,0,0,0.45);padding:8px 10px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="logo">
        <div class="twc">The<br/>Weather<br/>Channel</div>
        <div class="local8">LOCAL<br/><span>ON THE</span> 8s</div>
      </div>
      <div class="city-time">
        <div id="cityName">DES MOINES</div>
        <div id="time">8:00</div>
      </div>
      <div class="city-select">
        <select id="citySelect" aria-label="Choose city"></select>
      </div>
    </header>

    <div id="alertBar" class="alert hidden" role="status" aria-live="polite">
      <div class="alert-label">ALERT</div>
      <div id="alertText" class="alert-text">No alerts</div>
    </div>

    <section class="now-card">
      <div class="gauge">
        <div class="icon" id="icon">☀️</div>
        <div class="temp" id="tempValue">80°</div>
      </div>
      <div class="details">
        <div class="cond" id="condition">Sunny</div>
        <div class="meta">
          <div><strong>WIND</strong><span id="wind">NE 8 mph</span></div>
          <div><strong>GUSTS</strong><span id="gusts">NONE</span></div>
          <div><strong>FEELS LIKE</strong><span id="feels">82°</span></div>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <div class="nav-item active">Now</div>
      <div class="nav-item">Tonight</div>
      <div class="nav-item">Beyond</div>
    </nav>
  </div>

  <div class="offline-badge">Offline standalone index.html</div>

  <script>
    // Offline, self-contained sample data
    (function(){
      const cities = [
        {id:'desmoines',name:'DES MOINES',temp:92,icon:'☀️',condition:'Hot',wind:'SE 6 mph',gusts:'NONE',feels:94,alerts:['HEAT ADVISORY NOW IN EFFECT UNTIL 8 PM CDT THURSDAY']},
        {id:'indianapolis',name:'INDIANAPOLIS',temp:80,icon:'☀️',condition:'Sunny',wind:'NE 8 mph',gusts:'NONE',feels:82,alerts:[]},
        {id:'orlando',name:'ORLANDO',temp:86,icon:'⛅',condition:'Showers',wind:'E 12 mph',gusts:'20 mph',feels:88,alerts:['FLASH FLOOD WATCH UNTIL 2 AM EDT']}
      ];

      const citySelect = document.getElementById('citySelect');
      const cityName = document.getElementById('cityName');
      const timeEl = document.getElementById('time');
      const alertBar = document.getElementById('alertBar');
      const alertText = document.getElementById('alertText');
      const tempValue = document.getElementById('tempValue');
      const condition = document.getElementById('condition');
      const wind = document.getElementById('wind');
      const gusts = document.getElementById('gusts');
      const feels = document.getElementById('feels');
      const icon = document.getElementById('icon');

      function populateCities(){
        cities.forEach(c=>{
          const opt=document.createElement('option');opt.value=c.id;opt.textContent=c.name;citySelect.appendChild(opt);
        });
      }
      function getCity(id){return cities.find(c=>c.id===id)||cities[0];}
      function updateTime(){const now=new Date();const h=now.getHours()%12||12;const m=String(now.getMinutes()).padStart(2,'0');timeEl.textContent=h+':'+m}
      function updateUI(id){const c=getCity(id);cityName.textContent=c.name;tempValue.textContent=c.temp+'°';condition.textContent=c.condition;wind.textContent=c.wind;gusts.textContent=c.gusts;feels.textContent=c.feels+'°';icon.textContent=c.icon; if(c.alerts&&c.alerts.length){alertText.textContent=c.alerts.join(' — ');alertBar.classList.remove('hidden')}else{alertBar.classList.add('hidden')}}

      citySelect.addEventListener('change',e=>updateUI(e.target.value));
      populateCities();citySelect.value=cities[0].id;updateTime();updateUI(citySelect.value);setInterval(updateTime,60*1000);

      // Service Worker registration for hosted Pages
      if('serviceWorker' in navigator){
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(()=>{});
        });
      }
    })();
  </script>
</body>
</html>
